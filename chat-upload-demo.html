<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat File Upload UI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .demo-wrapper {
    display: flex;
    gap: 32px;
    padding: 32px;
    align-items: flex-end;
    max-width: 960px;
    width: 100%;
  }

  .demo-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .demo-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #6b7280;
    padding: 0 4px 4px;
  }

  /* ── Chat box shell ── */
  .chat-box {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,.10);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .chat-header {
    padding: 14px 18px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
    font-weight: 600;
    color: #111;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
  }

  .chat-messages {
    padding: 16px;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bubble {
    background: #f3f4f6;
    border-radius: 14px 14px 14px 4px;
    padding: 10px 14px;
    font-size: 14px;
    color: #374151;
    max-width: 85%;
    line-height: 1.4;
  }

  /* ── Input area ── */
  .input-area {
    border-top: 1px solid #f0f0f0;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ── File attachment staging area ── */
  .attachments {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 4px 2px 2px;
  }

  /* Individual tile (≤ 3 files) */
  .file-tile {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #f8f9ff;
    border: 1px solid #e0e4ff;
    border-radius: 10px;
    padding: 6px 8px 6px 10px;
    font-size: 12.5px;
    color: #374151;
    max-width: 180px;
    animation: tileIn .18s ease;
  }

  @keyframes tileIn {
    from { opacity: 0; transform: scale(.92); }
    to   { opacity: 1; transform: scale(1); }
  }

  .file-tile .file-icon {
    font-size: 16px;
    flex-shrink: 0;
  }

  .file-tile .file-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    font-weight: 500;
    color: #1f2937;
  }

  .file-tile .file-size {
    font-size: 10.5px;
    color: #9ca3af;
    white-space: nowrap;
  }

  .remove-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #9ca3af;
    font-size: 14px;
    line-height: 1;
    padding: 0 0 0 2px;
    border-radius: 50%;
    transition: color .15s, background .15s;
    flex-shrink: 0;
  }

  .remove-btn:hover {
    color: #ef4444;
    background: #fee2e2;
  }

  /* Group tile (> 3 files) */
  .group-tile {
    width: 100%;
    background: #f8f9ff;
    border: 1px solid #e0e4ff;
    border-radius: 12px;
    overflow: hidden;
    animation: tileIn .18s ease;
  }

  .group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    user-select: none;
    transition: background .15s;
  }

  .group-header:hover { background: #eef0ff; }

  .group-icon {
    font-size: 18px;
    flex-shrink: 0;
  }

  .group-label {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: #1f2937;
  }

  .group-count-badge {
    background: #6366f1;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
  }

  .chevron {
    color: #6b7280;
    font-size: 13px;
    transition: transform .22s ease;
    flex-shrink: 0;
  }

  .chevron.open { transform: rotate(180deg); }

  .group-body {
    display: none;
    flex-direction: column;
    border-top: 1px solid #e0e4ff;
    max-height: 200px;
    overflow-y: auto;
  }

  .group-body.open { display: flex; }

  .group-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    font-size: 12.5px;
    color: #374151;
    border-bottom: 1px solid #f3f4f6;
    transition: background .12s;
  }

  .group-row:last-child { border-bottom: none; }
  .group-row:hover { background: #f3f4ff; }

  .group-row .file-icon { font-size: 15px; flex-shrink: 0; }

  .group-row .file-name {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
    color: #1f2937;
  }

  .group-row .file-size { font-size: 10.5px; color: #9ca3af; white-space: nowrap; }

  .group-row .remove-btn { font-size: 13px; }

  /* ── Bottom input row ── */
  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 6px 8px 6px 12px;
  }

  .attach-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #9ca3af;
    font-size: 18px;
    padding: 4px;
    border-radius: 8px;
    transition: color .15s, background .15s;
    line-height: 1;
  }

  .attach-btn:hover { color: #6366f1; background: #eef2ff; }

  .text-input {
    flex: 1;
    border: none;
    background: transparent;
    outline: none;
    font-size: 14px;
    color: #111;
    line-height: 1.4;
  }

  .text-input::placeholder { color: #9ca3af; }

  .send-btn {
    background: #6366f1;
    border: none;
    cursor: pointer;
    color: #fff;
    font-size: 16px;
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, transform .1s;
    flex-shrink: 0;
  }

  .send-btn:hover { background: #4f46e5; transform: scale(1.05); }

  /* hidden file input */
  input[type=file] { display: none; }

  /* ── Demo control buttons ── */
  .demo-controls {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 0 4px;
  }

  .demo-btn {
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    background: #fff;
    cursor: pointer;
    color: #374151;
    font-weight: 500;
    transition: background .15s, border-color .15s;
  }

  .demo-btn:hover { background: #f3f4f6; border-color: #9ca3af; }
  .demo-btn.primary { background: #eef2ff; border-color: #c7d2fe; color: #4338ca; }
  .demo-btn.primary:hover { background: #e0e7ff; }
</style>
</head>
<body>

<div class="demo-wrapper">

  <!-- ── Variation A: few files (individual tiles) ── -->
  <div class="demo-col">
    <div class="demo-label">Variation A — Few files (≤ 3)</div>
    <div class="demo-controls">
      <button class="demo-btn primary" onclick="loadDemo('a', 'few')">Load 2 files</button>
      <button class="demo-btn" onclick="clearAttachments('a')">Clear</button>
    </div>
    <div class="chat-box">
      <div class="chat-header">
        <div class="avatar">AI</div>
        Assistant
      </div>
      <div class="chat-messages">
        <div class="bubble">Hi! Attach some files and send me a message.</div>
      </div>
      <div class="input-area">
        <div class="attachments" id="attach-a"></div>
        <div class="input-row">
          <button class="attach-btn" title="Attach files" onclick="triggerUpload('a')">📎</button>
          <input type="file" id="file-a" multiple onchange="handleFiles('a')">
          <input class="text-input" type="text" placeholder="Message…">
          <button class="send-btn">&#10148;</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Variation B: many files (group tile) ── -->
  <div class="demo-col">
    <div class="demo-label">Variation B — Many files (> 3)</div>
    <div class="demo-controls">
      <button class="demo-btn primary" onclick="loadDemo('b', 'many')">Load 6 files</button>
      <button class="demo-btn" onclick="clearAttachments('b')">Clear</button>
    </div>
    <div class="chat-box">
      <div class="chat-header">
        <div class="avatar">AI</div>
        Assistant
      </div>
      <div class="chat-messages">
        <div class="bubble">Hi! Attach some files and send me a message.</div>
      </div>
      <div class="input-area">
        <div class="attachments" id="attach-b"></div>
        <div class="input-row">
          <button class="attach-btn" title="Attach files" onclick="triggerUpload('b')">📎</button>
          <input type="file" id="file-b" multiple onchange="handleFiles('b')">
          <input class="text-input" type="text" placeholder="Message…">
          <button class="send-btn">&#10148;</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  // ── State ──
  const state = { a: [], b: [] };

  const ICONS = {
    pdf: '📄', doc: '📝', docx: '📝', txt: '📃',
    xls: '📊', xlsx: '📊', csv: '📊',
    png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️', webp: '🖼️',
    zip: '🗜️', rar: '🗜️',
    mp4: '🎬', mov: '🎬',
    mp3: '🎵', wav: '🎵',
    default: '📁'
  };

  function iconFor(name) {
    const ext = name.split('.').pop().toLowerCase();
    return ICONS[ext] || ICONS.default;
  }

  function fmtSize(bytes) {
    if (!bytes) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  // ── File input helpers ──
  function triggerUpload(id) { document.getElementById('file-' + id).click(); }

  function handleFiles(id) {
    const input = document.getElementById('file-' + id);
    const files = Array.from(input.files).map(f => ({ name: f.name, size: f.size }));
    state[id] = [...state[id], ...files];
    input.value = '';
    render(id);
  }

  function removeFile(id, idx) {
    state[id].splice(idx, 1);
    render(id);
  }

  function clearAttachments(id) { state[id] = []; render(id); }

  // ── Demo presets ──
  const DEMO_FILES = {
    few: [
      { name: 'Q1-Report.pdf', size: 204800 },
      { name: 'Notes.docx',    size: 35600  },
    ],
    many: [
      { name: 'Q1-Report.pdf',      size: 204800  },
      { name: 'Budget-2026.xlsx',   size: 89600   },
      { name: 'Meeting-Notes.docx', size: 35600   },
      { name: 'Screenshot.png',     size: 512000  },
      { name: 'Dataset.csv',        size: 1048576 },
      { name: 'Presentation.pdf',   size: 3145728 },
    ]
  };

  function loadDemo(id, preset) {
    state[id] = [...DEMO_FILES[preset]];
    render(id);
  }

  // ── Render ──
  function render(id) {
    const files = state[id];
    const container = document.getElementById('attach-' + id);
    container.innerHTML = '';

    if (files.length === 0) return;

    const THRESHOLD = 3;

    if (files.length <= THRESHOLD) {
      // Individual tiles
      files.forEach((f, i) => {
        const tile = document.createElement('div');
        tile.className = 'file-tile';
        tile.innerHTML = `
          <span class="file-icon">${iconFor(f.name)}</span>
          <div style="min-width:0;flex:1">
            <div class="file-name">${esc(f.name)}</div>
            <div class="file-size">${fmtSize(f.size)}</div>
          </div>
          <button class="remove-btn" title="Remove" onclick="removeFile('${id}',${i})">✕</button>
        `;
        container.appendChild(tile);
      });
    } else {
      // Group tile
      const groupId = 'grp-' + id;
      const tile = document.createElement('div');
      tile.className = 'group-tile';
      tile.innerHTML = `
        <div class="group-header" onclick="toggleGroup('${groupId}')">
          <span class="group-icon">📁</span>
          <span class="group-label">Documents</span>
          <span class="group-count-badge">${files.length}</span>
          <span class="chevron" id="chev-${groupId}">&#8964;</span>
        </div>
        <div class="group-body" id="${groupId}">
          ${files.map((f, i) => `
            <div class="group-row">
              <span class="file-icon">${iconFor(f.name)}</span>
              <span class="file-name">${esc(f.name)}</span>
              <span class="file-size">${fmtSize(f.size)}</span>
              <button class="remove-btn" title="Remove" onclick="removeFile('${id}',${i})">✕</button>
            </div>
          `).join('')}
        </div>
      `;
      container.appendChild(tile);
    }
  }

  function toggleGroup(groupId) {
    const body  = document.getElementById(groupId);
    const chev  = document.getElementById('chev-' + groupId);
    const open  = body.classList.toggle('open');
    chev.classList.toggle('open', open);
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Load both demos on start so they're immediately visible
  loadDemo('a', 'few');
  loadDemo('b', 'many');
</script>
</body>
</html>
